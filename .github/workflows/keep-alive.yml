name: Keep Streamlit apps awake

on:
  schedule:
    - cron: "0 */8 * * *"   # every 8 hours, under Streamlit's 12-hour sleep limit
  workflow_dispatch:         # run by hand from the Actions tab

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python .github/scripts/wake_apps.py
