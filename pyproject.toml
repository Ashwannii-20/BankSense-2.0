[project]
name = "bank-sense-2-0"
version = "0.1.0"
description = "End-to-end credit risk analytics with PD, LGD, ECL, macro stress testing and Streamlit dashboard."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "streamlit>=1.62.0",
]


[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
